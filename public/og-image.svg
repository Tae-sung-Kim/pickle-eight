<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="운빨연구소">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E5E7EB"/>
    </linearGradient>
    <linearGradient id="logoGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#111827" flood-opacity="0.13"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGradient)"/>

  <!-- ∞ 로고 (src/app/icon.svg 와 동일 형태, 512 좌표계를 0.9배) -->
  <g transform="translate(48, 85) scale(0.9)" filter="url(#softShadow)">
    <rect x="80" y="80" width="352" height="352" rx="88" fill="url(#logoGradient)"/>
    <path d="M128 256 C128 192 200 192 256 256 S384 320 384 256 S312 192 256 256 S128 320 128 256" fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="475" y="335" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',system-ui,sans-serif" font-size="128" font-weight="800" fill="#1e1b4b">운빨연구소</text>
  <text x="481" y="405" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',system-ui,sans-serif" font-size="36" font-weight="600" fill="#64748B">랜덤 · 로또 · 운세</text>
</svg>
